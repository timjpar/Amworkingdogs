<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AM Working Dogs">
  <title>AM Working Dogs</title>
  <!-- Badge -->
  <circle cx="32" cy="32" r="30" fill="#2f3d34" />
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c68a3e" stroke-width="2.5" />

  <!-- Ridgeline behind the head -->
  <path d="M4 46 L16 31 L23 39 L33 25 L43 39 L50 33 L60 46 Z" fill="#3c4f43" />

  <!-- Drop ears -->
  <path d="M21 20 C13.5 22 9 30.5 10.5 39.5 C14.5 38.5 19 33 20.8 26.5 Z" fill="#efe9dd" />
  <path d="M43 20 C50.5 22 55 30.5 53.5 39.5 C49.5 38.5 45 33 43.2 26.5 Z" fill="#efe9dd" />
  <!-- Inner-ear shading so the ears read separately from the skull -->
  <path d="M21.5 24 C16.5 26 13.8 31.5 14.8 37.2 C17.6 36.2 20.2 32.4 21.5 28.4 Z" fill="#c9bfae" />
  <path d="M42.5 24 C47.5 26 50.2 31.5 49.2 37.2 C46.4 36.2 43.8 32.4 42.5 28.4 Z" fill="#c9bfae" />

  <!-- Skull -->
  <path d="M32 13 C40 13 45.5 19 45.5 27 C45.5 33 44 37 41.5 41 C39 46 36 51.5 32 51.5 C28 51.5 25 46 22.5 41 C20 37 18.5 33 18.5 27 C18.5 19 24 13 32 13 Z" fill="#efe9dd" />

  <!-- Black mask over the muzzle -->
  <path d="M32 36.5 C36.5 36.5 39.5 39.5 39.5 43.5 C39.5 47.5 36 51.5 32 51.5 C28 51.5 24.5 47.5 24.5 43.5 C24.5 39.5 27.5 36.5 32 36.5 Z" fill="#2b2a26" />

  <!-- Eyes -->
  <ellipse cx="26" cy="29.5" rx="2.5" ry="2.9" fill="#2b2a26" />
  <ellipse cx="38" cy="29.5" rx="2.5" ry="2.9" fill="#2b2a26" />

  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="3.2" ry="2.4" fill="#efe9dd" />
</svg>
